name: Sync from Cafe24 (FTP -> git)

# 서버(FTP)에서 직접 수정된 코드를 git으로 가져온다.
# 결과는 server-sync 브랜치 + PR로 올라가며, main에는 PR을 Merge해야 반영된다.
# (PR 자동 생성이 막혀 있으면 브랜치만 올라가고 Actions 로그에 경고가 뜬다.)

on:
  workflow_dispatch:
  schedule:
    - cron: '0 18 * * *'   # 매일 03:00 KST

permissions:
  contents: write
  pull-requests: write

jobs:
  sync:
    name: Pull server changes into git
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install lftp
        run: sudo apt-get update && sudo apt-get install -y lftp

      - name: Download server files
        env:
          FTP_SERVER: ${{ secrets.FTP_SERVER }}
          FTP_USERNAME: ${{ secrets.FTP_USERNAME }}
          FTP_PASSWORD: ${{ secrets.FTP_PASSWORD }}
        run: |
          SNAP="$RUNNER_TEMP/server_snapshot"
          mkdir -p "$SNAP"
          SCRIPT_FILE="$RUNNER_TEMP/sync.lftp"
          umask 077
          cat > "$SCRIPT_FILE" <<SCRIPT
          set ftp:ssl-allow no
          set net:max-retries 3
          set net:reconnect-interval-base 5
          set net:timeout 20
          open -u ${FTP_USERNAME},${FTP_PASSWORD} ${FTP_SERVER}
          pwd
          mirror --parallel=5 --no-perms --exclude-glob .git* --exclude-glob .github/ --exclude-glob .claude/ --exclude-glob data/ --exclude-glob docker/ --exclude-glob bak/ --exclude-glob *.sql --exclude-glob Dockerfile --exclude-glob docker-compose.yml ./ $SNAP
          bye
          SCRIPT
          lftp -f "$SCRIPT_FILE"
          rm -f "$SCRIPT_FILE"

          # 접속 정보가 들어 있을 수 있는 스크립트 파일은 절대 가져오지 않는다
          find "$SNAP" -type f -name '*.lftp' -print -delete | sed 's/^/skipped (credential script): /'

          # git에 넣기엔 너무 큰 파일(50MB 초과)은 제외
          find "$SNAP" -type f -size +50M -print -delete | sed 's/^/skipped (too large): /'

          # UTF-8이 아닌 깨진 파일명(예: 한글 인코딩 오류)은 Windows 체크아웃을 깨뜨리므로 제외
          find "$SNAP" -print0 | while IFS= read -r -d '' p; do
            if ! printf '%s' "$p" | iconv -f UTF-8 -t UTF-8 > /dev/null 2>&1; then
              echo "skipped (non-UTF-8 name): $p"
              rm -rf -- "$p"
            fi
          done

          # 다운로드한 서버 파일을 작업 폴더에 덮어쓴다 (삭제는 하지 않음)
          # .git / .github 는 절대 덮어쓰지 않는다 (인증 정보와 워크플로우 보호)
          rsync -rlt --checksum \
            --exclude='/.git/' --exclude='/.github/' --exclude='/.claude/' \
            "$SNAP"/ ./

      - name: Commit and open PR
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          # 서버 파일이 CRLF여도 줄바꿈 차이만으로 변경 처리되지 않게 정규화
          git config core.autocrlf input

          git add -A
          if git diff --cached --quiet; then
            echo "서버와 git이 동일합니다. 변경 없음."
            exit 0
          fi

          # 접속 정보/비밀 파일이 커밋에 섞였으면 중단
          if git diff --cached --name-only | grep -Eiq '\.lftp$|(^|/)\.env$|dbconfig\.php$'; then
            echo "::error::민감할 수 있는 파일이 포함되어 중단합니다:"
            git diff --cached --name-only | grep -Ei '\.lftp$|(^|/)\.env$|dbconfig\.php$'
            exit 1
          fi

          {
            echo "Cafe24 서버에서 직접 수정된 파일을 가져왔습니다."
            echo
            echo '```'
            git diff --cached --stat | tail -n 60
            echo '```'
            echo
            echo "확인 후 Merge하면 main이 서버 상태와 같아집니다."
          } > "$RUNNER_TEMP/pr_body.md"

          git checkout -B server-sync
          git commit -m "Sync from Cafe24 server"
          # 저장된 인증이 사라진 경우(could not read Username)를 대비해 토큰을 명시
          git remote set-url origin "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          git push --force origin HEAD:server-sync

          if [ "$(gh pr list --head server-sync --state open --json number --jq length)" = "0" ]; then
            gh pr create --base main --head server-sync \
              --title "Sync from Cafe24 server" \
              --body-file "$RUNNER_TEMP/pr_body.md" \
              || echo "::warning::PR 자동 생성 실패. Settings > Actions > General 에서 'Allow GitHub Actions to create pull requests'를 켜거나, server-sync 브랜치로 직접 PR을 만드세요."
          fi
