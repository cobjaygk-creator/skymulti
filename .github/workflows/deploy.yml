name: Deploy to Cafe24 (FTP)

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  ftp-deploy:
    name: FTP Deploy
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install lftp
        run: sudo apt-get update && sudo apt-get install -y lftp

      - name: Deploy via FTP (lftp mirror)
        env:
          FTP_SERVER: ${{ secrets.FTP_SERVER }}
          FTP_USERNAME: ${{ secrets.FTP_USERNAME }}
          FTP_PASSWORD: ${{ secrets.FTP_PASSWORD }}
        run: |
          cat > deploy.lftp <<'SCRIPT'
          set ftp:ssl-allow no
          set net:max-retries 3
          set net:reconnect-interval-base 5
          set net:timeout 20
          set mirror:parallel-transfer-count 5
          SCRIPT
          echo "open -u ${FTP_USERNAME},${FTP_PASSWORD} ${FTP_SERVER}" >> deploy.lftp
          cat >> deploy.lftp <<'SCRIPT'
          mirror -R --no-perms --parallel=5 --exclude-glob .git* --exclude-glob .github/ --exclude-glob .claude/ --exclude-glob data/ --exclude-glob docker/ --exclude-glob *.sql --exclude-glob Dockerfile --exclude-glob docker-compose.yml ./ ./
          bye
          SCRIPT
          lftp -f deploy.lftp
          rm -f deploy.lftp
