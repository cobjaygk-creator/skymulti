name: Deploy to Cafe24 (FTP)

# 임시: 자동 실행(push 트리거)을 끄고 수동 실행 전용으로 둔다.
# 전체 덮어쓰기 방식이라 서버에서 직접 수정한 파일을 되돌리는 문제가 있어서,
# 서버->git 동기화가 끝나고 "변경된 파일만 업로드" 방식으로 바꾼 뒤 push 트리거를 복구한다.
on:
  workflow_dispatch:

jobs:
  ftp-deploy:
    name: FTP Deploy
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install lftp
        run: sudo apt-get update && sudo apt-get install -y lftp

      - name: Deploy via FTP (lftp mirror)
        env:
          FTP_SERVER: ${{ secrets.FTP_SERVER }}
          FTP_USERNAME: ${{ secrets.FTP_USERNAME }}
          FTP_PASSWORD: ${{ secrets.FTP_PASSWORD }}
        run: |
          # 접속 정보가 들어가는 스크립트는 작업 폴더(업로드 대상) 밖에 만든다.
          # (이전에는 작업 폴더에 만들어져서 deploy.lftp가 서버 웹루트에 함께 업로드되었음)
          SCRIPT_FILE="$RUNNER_TEMP/deploy.lftp"
          umask 077
          cat > "$SCRIPT_FILE" <<'SCRIPT'
          set ftp:ssl-allow no
          set net:max-retries 3
          set net:reconnect-interval-base 5
          set net:timeout 20
          set mirror:parallel-transfer-count 5
          SCRIPT
          echo "open -u ${FTP_USERNAME},${FTP_PASSWORD} ${FTP_SERVER}" >> "$SCRIPT_FILE"
          cat >> "$SCRIPT_FILE" <<'SCRIPT'
          mirror -R --no-perms --parallel=5 --exclude-glob .git* --exclude-glob .github/ --exclude-glob .claude/ --exclude-glob data/ --exclude-glob docker/ --exclude-glob *.sql --exclude-glob *.lftp --exclude-glob Dockerfile --exclude-glob docker-compose.yml ./ ./
          bye
          SCRIPT
          lftp -f "$SCRIPT_FILE"
          rm -f "$SCRIPT_FILE"
