name: Deploy to Cafe24 (FTP)

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  ftp-deploy:
    name: FTP Deploy
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install lftp
        run: sudo apt-get update && sudo apt-get install -y lftp dnsutils netcat-openbsd

      - name: Diagnose FTP connectivity
        env:
          FTP_SERVER: ${{ secrets.FTP_SERVER }}
          FTP_USERNAME: ${{ secrets.FTP_USERNAME }}
          FTP_PASSWORD: ${{ secrets.FTP_PASSWORD }}
        run: |
          echo "FTP_SERVER length: ${#FTP_SERVER}"
          echo "FTP_USERNAME length: ${#FTP_USERNAME}"
          echo "FTP_PASSWORD length: ${#FTP_PASSWORD}"
          echo "--- DNS lookup ---"
          getent hosts "$FTP_SERVER" || echo "DNS lookup FAILED for FTP_SERVER"
          echo "--- Port 21 reachability ---"
          nc -zv -w 10 "$FTP_SERVER" 21 || echo "Port 21 connection FAILED"

      - name: Deploy via FTP (lftp mirror)
        env:
          FTP_SERVER: ${{ secrets.FTP_SERVER }}
          FTP_USERNAME: ${{ secrets.FTP_USERNAME }}
          FTP_PASSWORD: ${{ secrets.FTP_PASSWORD }}
        run: |
          lftp -u "$FTP_USERNAME,$FTP_PASSWORD" -e "
            debug 5;
            set ftp:ssl-allow no;
            set net:max-retries 3;
            set net:reconnect-interval-base 5;
            mirror -R --verbose \
              --exclude-glob .git* \
              --exclude-glob .github/ \
              --exclude-glob .claude/ \
              --exclude-glob data/ \
              --exclude-glob docker/ \
              --exclude-glob *.sql \
              --exclude-glob Dockerfile \
              --exclude-glob docker-compose.yml \
              ./ ./;
            bye
          " "$FTP_SERVER"
